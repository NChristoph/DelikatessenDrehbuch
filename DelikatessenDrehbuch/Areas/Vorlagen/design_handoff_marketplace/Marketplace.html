<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Marketplace — Karten Redesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: #efece6; font-family: 'Inter', sans-serif; }
  @keyframes mp-fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes mp-pulse {
    0% { box-shadow: 0 0 0 0 rgba(95,160,82,0.6); }
    70% { box-shadow: 0 0 0 6px rgba(95,160,82,0); }
    100% { box-shadow: 0 0 0 0 rgba(95,160,82,0); }
  }
  .frame-host { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="card-variant-a.jsx"></script>
<script type="text/babel" src="card-variant-b.jsx"></script>
<script type="text/babel" src="card-variant-c.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="cards"
        title="Marketplace · Karten-Varianten"
        subtitle="Drei Richtungen für die Plan-Karten — Karussell, Makros, Premium-Look. Klicke eine Karte zum Vergrößern.">
        <DCArtboard id="va" label="A · Magazine Hero" width={390} height={1180}>
          <PhoneFrame><SingleVariant variant="A" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="va-workout" label="A · Trainingsplan-Variante" width={390} height={1180}>
          <PhoneFrame><SingleVariant variant="A" planIdx={1} /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="va-combo" label="A · Kombi (Eat & Train)" width={390} height={1180}>
          <PhoneFrame><SingleVariant variant="A" planIdx={2} /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="vb" label="B · Tabbed Card" width={390} height={1180}>
          <PhoneFrame><SingleVariant variant="B" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="vc" label="C · Premium Dark" width={390} height={1180}>
          <PhoneFrame><SingleVariant variant="C" /></PhoneFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="full"
        title="Full Marketplace · Variante A"
        subtitle="Komplettes Markt-Erlebnis mit allen drei Plan-Typen (Ernährung, Workout, Kombi).">
        <DCArtboard id="full-a" label="Marketplace · Vollansicht" width={390} height={1400}>
          <PhoneFrame><FullMarketplace variant="A" /></PhoneFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

// Lightweight phone frame wrapper
function PhoneFrame({ children }) {
  return (
    <div style={{
      width: '100%', height: '100%',
      background: 'white',
      borderRadius: 36,
      overflow: 'hidden',
      position: 'relative',
      boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.06)',
    }}>
      {/* iOS-style status bar */}
      <div style={{
        height: 44,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '0 24px',
        fontSize: 14,
        fontWeight: 600,
        color: '#000',
        position: 'absolute',
        top: 0, left: 0, right: 0,
        zIndex: 10,
        pointerEvents: 'none',
      }}>
        <span>9:41</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <svg width="16" height="10" viewBox="0 0 16 10" fill="#000"><rect x="0" y="6" width="3" height="4" rx="0.5"/><rect x="4" y="4" width="3" height="6" rx="0.5"/><rect x="8" y="2" width="3" height="8" rx="0.5"/><rect x="12" y="0" width="3" height="10" rx="0.5"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="#000"/><rect x="2" y="2" width="17" height="7" rx="1.5" fill="#000"/><rect x="21" y="3.5" width="1.5" height="4" rx="0.5" fill="#000"/></svg>
        </div>
      </div>
      <div style={{ position: 'absolute', inset: 0, paddingTop: 44 }}>
        {children}
      </div>
      {/* Home indicator */}
      <div style={{
        position: 'absolute', bottom: 8, left: '50%',
        transform: 'translateX(-50%)',
        width: 134, height: 5,
        borderRadius: 999,
        background: 'rgba(0,0,0,0.85)',
        zIndex: 20,
      }} />
    </div>
  );
}

// Single-card display (one card visible)
function SingleVariant({ variant, planIdx = null }) {
  const Comp = variant === 'A' ? CardVariantA : variant === 'B' ? CardVariantB : CardVariantC;
  const idx = planIdx != null ? planIdx : (variant === 'B' ? 1 : variant === 'C' ? 2 : 0);
  return (
    <div className="mp-screen">
      <div className="mp-header">
        <button className="mp-back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div style={{ flex: 1, marginLeft: 4 }}>
          <h1>Marktplatz</h1>
          <div className="sub">Pläne kaufen & verkaufen</div>
        </div>
        <button className="mp-sell-btn"><span className="plus">+</span> Verkaufen</button>
      </div>
      <div className="mp-wallet">
        <div className="mp-wallet-row">
          <div>
            <div className="mp-wallet-label">World Wallet</div>
            <div className="mp-wallet-status">
              <span style={{ display: 'inline-block', width: 6, height: 6, borderRadius: '50%', background: '#5fa052', marginRight: 5 }}></span>
              Verbunden · 2.84 WLD
            </div>
          </div>
          <div className="mp-wallet-btns">
            <button className="mp-wallet-btn primary">Meine</button>
            <button className="mp-wallet-btn">Aktivität</button>
          </div>
        </div>
      </div>
      <div className="mp-filters">
        <button className="mp-chip active">Alle (3)</button>
        <button className="mp-chip"><span>🥑</span> Ernährung</button>
        <button className="mp-chip"><span>💪</span> Workout</button>
        <button className="mp-chip"><span>🌿</span> Kombi</button>
        <button className="mp-chip">Premium</button>
      </div>
      <div className="mp-feed" style={{ paddingBottom: 100 }}>
        <Comp plan={PLANS[idx]} />
      </div>
      <BottomNav />
    </div>
  );
}

function FullMarketplace({ variant }) {
  const Comp = variant === 'A' ? CardVariantA : variant === 'B' ? CardVariantB : CardVariantC;
  return (
    <div className="mp-screen">
      <div className="mp-header">
        <button className="mp-back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div style={{ flex: 1, marginLeft: 4 }}>
          <h1>Marktplatz</h1>
          <div className="sub">Pläne kaufen & verkaufen</div>
        </div>
        <button className="mp-sell-btn"><span className="plus">+</span> Verkaufen</button>
      </div>
      <div className="mp-wallet">
        <div className="mp-wallet-row">
          <div>
            <div className="mp-wallet-label">World Wallet</div>
            <div className="mp-wallet-status">
              <span style={{ display: 'inline-block', width: 6, height: 6, borderRadius: '50%', background: '#5fa052', marginRight: 5 }}></span>
              Verbunden · 2.84 WLD
            </div>
          </div>
          <div className="mp-wallet-btns">
            <button className="mp-wallet-btn primary">Meine</button>
            <button className="mp-wallet-btn">Aktivität</button>
          </div>
        </div>
      </div>
      <div className="mp-filters">
        <button className="mp-chip active">Alle (3)</button>
        <button className="mp-chip"><span>🥑</span> Ernährung</button>
        <button className="mp-chip"><span>💪</span> Workout</button>
        <button className="mp-chip"><span>🌿</span> Kombi</button>
        <button className="mp-chip">Premium</button>
      </div>
      <div className="mp-feed" style={{ paddingBottom: 100 }}>
        {PLANS.map(p => <Comp key={p.id} plan={p} />)}
      </div>
      <BottomNav />
    </div>
  );
}

function BottomNav() {
  return (
    <div className="mp-bottom">
      <button className="mp-bottom-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        Home
      </button>
      <button className="mp-bottom-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span className="badge">2</span>
        Aktiv
      </button>
      <button className="mp-fab">+</button>
      <button className="mp-bottom-btn active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Markt
      </button>
      <button className="mp-bottom-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profil
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
