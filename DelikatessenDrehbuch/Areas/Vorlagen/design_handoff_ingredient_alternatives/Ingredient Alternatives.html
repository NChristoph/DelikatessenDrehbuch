<script type="text/babel">

        padding: '0 24px', fontSize: 14, fontWeight: 600, color: '#fff',

        position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
        width: 134, height: 5, borderRadius: 999,
        background: 'rgba(0,0,0,0.85)', zIndex: 70,
      }} />

  );

function App() {
  return (
    <DesignCanvas>
