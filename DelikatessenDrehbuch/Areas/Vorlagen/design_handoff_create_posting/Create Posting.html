<script type="text/babel">

function PhoneFrame({ children }) {

    }}>
      {/* iOS-style status bar */}
      <div style={{
        height: 44,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '0 24px',
        fontSize: 14,
        fontWeight: 600,
        color: '#000',
        position: 'absolute',
        top: 0, left: 0, right: 0,
        zIndex: 10,
        pointerEvents: 'none',

        <span>9:41</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <svg width="16" height="10" viewBox="0 0 16 10" fill="#000"><rect x="0" y="6" width="3" height="4" rx="0.5"/><rect x="4" y="4" width="3" height="6" rx="0.5"/><rect x="8" y="2" width="3" height="8" rx="0.5"/><rect x="12" y="0" width="3" height="10" rx="0.5"/></svg>

      </div>
      <div style={{ position: 'absolute', inset: 0, paddingTop: 44 }}>
        {children}
      </div>
      <div style={{
        position: 'absolute', bottom: 8, left: '50%',
        transform: 'translateX(-50%)',
        width: 134, height: 5,
        borderRadius: 999,
        background: 'rgba(0,0,0,0.85)',
        zIndex: 20,
      }} />
    </div>

function App() {
  return (

        title="Create Posting · Redesign"

        <DCArtboard id="cp-a" label="A · Scroll Stack (Light)" width={390} height={1280} data-screen-label="A Scroll Stack">
