<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>User Profile — Avocado</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: #efece6; font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="profile.jsx"></script>

<script type="text/babel">
function PhoneFrame({ children }) {
  return (
    <div style={{
      width: '100%', height: '100%',
      background: '#f5efe1',
      borderRadius: 36,
      overflow: 'hidden',
      position: 'relative',
      boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.06)',
    }}>
      <div style={{
        height: 36,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 24px',
        fontSize: 13, fontWeight: 600, color: '#14391f',
        position: 'absolute', top: 0, left: 0, right: 0,
        zIndex: 10, pointerEvents: 'none',
      }}>
        <span>9:41</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <svg width="16" height="10" viewBox="0 0 16 10" fill="#14391f"><rect x="0" y="6" width="3" height="4" rx="0.5"/><rect x="4" y="4" width="3" height="6" rx="0.5"/><rect x="8" y="2" width="3" height="8" rx="0.5"/><rect x="12" y="0" width="3" height="10" rx="0.5"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="#14391f"/><rect x="2" y="2" width="17" height="7" rx="1.5" fill="#14391f"/><rect x="21" y="3.5" width="1.5" height="4" rx="0.5" fill="#14391f"/></svg>
        </div>
      </div>
      <div style={{ position: 'absolute', inset: 0, paddingTop: 36 }}>{children}</div>
      <div style={{
        position: 'absolute', bottom: 8, left: '50%',
        transform: 'translateX(-50%)',
        width: 134, height: 5,
        borderRadius: 999,
        background: 'rgba(0,0,0,0.85)', zIndex: 20,
      }} />
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="profile"
        title="User Profile · Avocado-Stil"
        subtitle="Profil-Header + Tab-Bar (Likes · AI · Abos · Erstellt · Gekauft · Videos) und ausgeklapptes Creator Dashboard.">
        <DCArtboard id="p-likes"     label="Likes"           width={390} height={1280} data-screen-label="01 Likes">
          <PhoneFrame><PScreen initialTab="likes" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="p-ai"        label="AI"              width={390} height={1280} data-screen-label="02 AI">
          <PhoneFrame><PScreen initialTab="ai" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="p-abos"      label="Abos"            width={390} height={1280} data-screen-label="03 Abos">
          <PhoneFrame><PScreen initialTab="abos" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="p-erstellt"  label="Erstellt"        width={390} height={1280} data-screen-label="04 Erstellt">
          <PhoneFrame><PScreen initialTab="erstellt" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="p-gekauft"   label="Gekauft"         width={390} height={1280} data-screen-label="05 Gekauft">
          <PhoneFrame><PScreen initialTab="gekauft" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="p-videos"    label="Videos"          width={390} height={1280} data-screen-label="06 Videos">
          <PhoneFrame><PScreen initialTab="videos" /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="p-dash"      label="Creator Dashboard (open)" width={390} height={2400} data-screen-label="07 Dashboard">
          <PhoneFrame><PScreen initialTab="likes" dashboardOpen={true} /></PhoneFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
