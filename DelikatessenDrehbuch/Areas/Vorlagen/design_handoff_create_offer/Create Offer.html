<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Angebot erstellen — Redesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: #efece6; font-family: 'Inter', sans-serif; }
  #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 0; }

  /* ===== Create Offer ===== */
  .co-root { position: relative; }
  .co-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* floating language toggle */
  .co-lang {
    position: absolute;
    top: 14px; right: 16px;
    z-index: 30;
    display: inline-flex; align-items: center; gap: 5px;
    background: #fff;
    border: 1px solid var(--ink-line);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12px; font-weight: 600;
    color: var(--ink-deep);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    font-family: var(--font-sans);
  }
  .co-lang-flag {
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.04em;
    background: var(--bg-cream-2);
    color: var(--ink-mid);
    padding: 2px 4px; border-radius: 4px;
  }
  .co-lang svg { opacity: 0.6; }

  /* back link */
  .co-back {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--ink-deep);
    font-size: 14px; font-weight: 600;
    font-family: var(--font-sans);
    cursor: pointer;
    padding: 2px 0;
    align-self: flex-start;
    margin-bottom: 2px;
  }

  /* intro card */
  .co-intro {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 20px 20px 22px;
    box-shadow: var(--shadow-sm);
  }
  .co-intro h1 {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.025em;
    line-height: 1.04;
    margin: 0 0 8px;
    color: var(--ink-deep);
  }
  .co-intro p {
    margin: 0;
    font-size: 14px; line-height: 1.55;
    color: var(--ink-mute);
    text-wrap: pretty;
  }

  /* wallet cards */
  .co-wallet {
    background: linear-gradient(135deg, #1f4329, #0e2415);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    box-shadow: var(--shadow-md);
  }
  .co-wallet-title { font-size: 13.5px; font-weight: 600; margin-bottom: 5px; }
  .co-wallet-warn { font-size: 12.5px; line-height: 1.4; color: var(--gold); }
  .co-wallet-warn b { font-weight: 700; }
  .co-wallet-ok {
    font-size: 12.5px; color: rgba(255,255,255,0.85);
    display: flex; align-items: center; gap: 6px;
  }
  .co-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--avocado); display: inline-block; box-shadow: 0 0 0 3px rgba(95,160,82,0.25); }
  .co-wallet-btn {
    flex-shrink: 0;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    width: 78px; height: 56px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.30);
    border-radius: 16px;
    color: #fff;
    font-size: 11.5px; font-weight: 600;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: background 0.15s;
  }
  .co-wallet-btn:hover { background: rgba(255,255,255,0.13); }
  .co-wallet-btn.is-on { background: rgba(95,160,82,0.22); border-color: rgba(95,160,82,0.55); }

  /* split banner */
  .co-banner {
    background: #f6ead0;
    border: 1px solid #e9d3a3;
    border-radius: var(--radius-md);
    padding: 13px 15px;
    display: flex; gap: 11px;
    font-size: 13px; line-height: 1.5;
    color: #715a24;
  }
  .co-banner b { color: var(--ink-deep); font-weight: 700; }
  .co-banner-ico { color: var(--ink-deep); flex-shrink: 0; margin-top: 1px; }

  /* numbered section block */
  .co-block {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 18px 18px 20px;
    box-shadow: var(--shadow-sm);
  }
  .co-block-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  .co-num {
    width: 24px; height: 24px; border-radius: 8px;
    background: var(--ink-deep); color: #fff;
    font-family: var(--font-serif); font-weight: 600; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .co-block-title { font-size: 15.5px; font-weight: 700; color: var(--ink-deep); }

  /* type grid */
  .co-types {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }
  .co-type {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
    padding: 16px 6px 13px;
    background: var(--card-soft);
    border: 1.5px solid var(--ink-line);
    border-radius: 16px;
    color: var(--ink-mid);
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s;
  }
  .co-type:hover { border-color: rgba(20,57,31,0.28); }
  .co-type.sel {
    border-color: var(--ink-deep);
    border-width: 2px;
    background: #fff;
    box-shadow: var(--shadow-sm);
  }
  .co-type-ico { color: var(--ink-deep); display: flex; }
  .co-type.sel .co-type-ico { color: var(--avocado); }
  .co-type-label { font-size: 12.5px; font-weight: 600; color: var(--ink-deep); }

  /* conditional sub block */
  .co-sub { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--ink-line); }
  .co-sublabel { font-size: 13px; font-weight: 700; color: var(--ink-deep); margin-bottom: 10px; }
  .co-stack { display: flex; flex-direction: column; gap: 10px; }
  .co-hint { font-size: 12.5px; line-height: 1.45; color: var(--ink-mute); margin-top: 10px; text-wrap: pretty; }

  /* inputs */
  .co-input {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--ink-line);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 14px;
    font-family: var(--font-sans);
    color: var(--ink-text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .co-input::placeholder { color: #9aa295; }
  .co-input:focus {
    outline: none;
    border-color: var(--avocado);
    box-shadow: 0 0 0 3px rgba(95,160,82,0.14);
  }
  .co-area { resize: none; line-height: 1.5; }

  /* select */
  .co-select-wrap { position: relative; }
  .co-select {
    width: 100%;
    appearance: none; -webkit-appearance: none;
    background: #fff;
    border: 1.5px solid var(--ink-line);
    border-radius: 12px;
    padding: 13px 38px 13px 14px;
    font-size: 14px; font-family: var(--font-sans);
    color: var(--ink-text);
    cursor: pointer;
  }
  .co-select:focus { outline: none; border-color: var(--avocado); box-shadow: 0 0 0 3px rgba(95,160,82,0.14); }
  .co-select-chev { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-mute); pointer-events: none; }

  /* pick cards (plan) */
  .co-pick {
    position: relative;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--ink-line);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s;
  }
  .co-pick:hover { border-color: rgba(20,57,31,0.28); }
  .co-pick.sel { border-color: var(--ink-deep); border-width: 2px; background: var(--card-soft); padding: 13px 15px; }
  .co-pick-name { font-family: var(--font-serif); font-weight: 600; font-size: 17px; color: var(--ink-deep); }
  .co-pick-meta { font-size: 12.5px; color: var(--ink-mute); margin-top: 3px; }
  .co-pick-check {
    position: absolute; top: 14px; right: 14px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--avocado); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }

  /* checkbox row */
  .co-checkrow {
    display: flex; align-items: flex-start; gap: 10px;
    background: none; border: none; padding: 2px 0;
    text-align: left; cursor: pointer;
    font-size: 13.5px; line-height: 1.4; color: var(--ink-mid);
    font-family: var(--font-sans);
  }
  .co-box {
    flex-shrink: 0;
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px solid var(--ink-line);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .co-box.on { background: var(--ink-deep); border-color: var(--ink-deep); }

  /* price */
  .co-price-row { display: flex; align-items: center; gap: 14px; }
  .co-price-box {
    background: #fff;
    border: 1.5px solid var(--ink-line);
    border-radius: 14px;
    padding: 10px 18px;
    min-width: 120px;
  }
  .co-price-input {
    width: 100%;
    border: none; outline: none; background: none;
    font-family: var(--font-serif); font-weight: 600;
    font-size: 32px; color: var(--ink-deep);
    text-align: center;
  }
  .co-price-cur { font-size: 19px; font-weight: 700; color: var(--ink-mute); letter-spacing: -0.01em; }
  .co-split { margin-top: 14px; font-size: 13px; line-height: 1.5; color: var(--ink-mute); }
  .co-split b { color: var(--ink-deep); font-weight: 700; }
  .co-split-sep { opacity: 0.5; }

  /* CTA */
  .co-cta {
    margin-top: 4px;
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    background: linear-gradient(135deg, #1a3a23, #0e2415);
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 17px;
    font-size: 15.5px; font-weight: 700;
    font-family: var(--font-sans);
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(20,57,31,0.26);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .co-cta:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(20,57,31,0.30); }
  .co-cta:active { transform: translateY(0); }
  .co-cta.disabled {
    background: #a7b6a0;
    color: rgba(255,255,255,0.92);
    box-shadow: none;
    cursor: not-allowed;
  }
  .co-cta.disabled:hover { transform: none; }
  .co-cta-note { text-align: center; font-size: 12px; color: var(--ink-mute); margin-top: -4px; }

  .frame-host { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="create-offer.jsx"></script>

<script type="text/babel">
function PhoneFrame({ children }) {
  return (
    <div style={{
      width: 390, height: 'min(844px, calc(100vh - 56px))',
      background: 'white',
      borderRadius: 40,
      overflow: 'hidden',
      position: 'relative',
      boxShadow: '0 30px 80px rgba(20,57,31,0.22), inset 0 0 0 1px rgba(0,0,0,0.06)',
    }}>
      <div style={{
        height: 44, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 26px', fontSize: 14, fontWeight: 600, color: '#14391f',
        position: 'absolute', top: 0, left: 0, right: 0, zIndex: 40, pointerEvents: 'none',
      }}>
        <span>9:41</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <svg width="16" height="10" viewBox="0 0 16 10" fill="#14391f"><rect x="0" y="6" width="3" height="4" rx="0.5"/><rect x="4" y="4" width="3" height="6" rx="0.5"/><rect x="8" y="2" width="3" height="8" rx="0.5"/><rect x="12" y="0" width="3" height="10" rx="0.5"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="#14391f"/><rect x="2" y="2" width="17" height="7" rx="1.5" fill="#14391f"/><rect x="21" y="3.5" width="1.5" height="4" rx="0.5" fill="#14391f"/></svg>
        </div>
      </div>
      <div style={{ position: 'absolute', inset: 0, paddingTop: 44, display: 'flex' }}>
        {children}
      </div>
      <div style={{
        position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
        width: 134, height: 5, borderRadius: 999, background: 'rgba(20,57,31,0.6)', zIndex: 50,
      }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <PhoneFrame><CreateOffer /></PhoneFrame>
);
</script>
</body>
</html>
